<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4"/>

  <path d="M 146 190 A 150 150 0 0 1 366 190" fill="none" stroke="#38bdf8" stroke-width="18" stroke-linecap="round" opacity="0.35"/>
  <path d="M 182 226 A 105 105 0 0 1 330 226" fill="none" stroke="#38bdf8" stroke-width="18" stroke-linecap="round" opacity="0.75"/>
  <circle cx="256" cy="256" r="16" fill="#38bdf8" filter="url(#glow)"/>

  <path d="M 130 330 L 130 370 A 30 30 0 0 0 160 400 L 352 400 A 30 30 0 0 0 382 370 L 382 330" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M 256 160 L 256 340 M 186 270 L 256 340 L 326 270" fill="none" stroke="url(#arrowGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
