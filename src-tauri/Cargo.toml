[package]
name = "localdrop"
version = "0.1.0"
description = "LocalDrop - Local Network File Transfer"
authors = ["Sanzy Dev"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "localdrop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8.9", features = ["ws", "multipart"] }
tower-http = { version = "0.7.1", features = ["cors", "fs", "trace"] }
tokio = { version = "1.53.1", features = ["full"] }
local-ip-address = "0.6.13"
uuid = { version = "1", features = ["v4", "fast-rng", "serde"] }
zip = "8.6.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "7.0.0"
futures-util = "0.3.34"
rfd = "0.17.2"
tokio-util = { version = "0.7", features = ["io"] }
open = "5.4.4"
mime_guess = "2.0.5"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
